<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <defs>
    <linearGradient id="bgdisp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f0ff"/>
      <stop offset="100%" stop-color="#f0e8ff"/>
    </linearGradient>
    <linearGradient id="bodydisp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c8b0e8" stop-opacity="0.5"/>
      <stop offset="25%" stop-color="#e8d8ff" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#f8f0ff" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#d8c4f0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#b09cd8" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="pumpdisp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7b68d4"/>
      <stop offset="100%" stop-color="#4a3a8c"/>
    </linearGradient>
    <linearGradient id="capdisp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9b8ae0"/>
      <stop offset="100%" stop-color="#5a4aaa"/>
    </linearGradient>
    <filter id="shadowdisp">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
  </defs>
  <rect width="300" height="400" fill="url(#bgdisp)" rx="16"/>
  <g filter="url(#shadowdisp)">
    <!-- Pump nozzle head (horizontal T) -->
    <rect x="100" y="28" width="80" height="14" rx="6" fill="url(#pumpdisp)"/>
    <!-- Pump actuator (the press-down part) -->
    <rect x="141" y="20" width="18" height="24" rx="4" fill="url(#pumpdisp)"/>
    <!-- Pump tube (vertical) -->
    <rect x="146" y="42" width="8" height="40" rx="3" fill="#7b68d4"/>
    <!-- Cap collar -->
    <rect x="127" y="78" width="46" height="16" rx="6" fill="url(#capdisp)"/>
    <rect x="123" y="91" width="54" height="8" rx="3" fill="#4a3a8c"/>
    <!-- Neck (narrow) -->
    <rect x="130" y="99" width="40" height="26" rx="4" fill="url(#bodydisp)" stroke="#b09cd8" stroke-width="1"/>
    <!-- Shoulder -->
    <path d="M 105 125 Q 130 120 130 130 L 130 135 L 170 135 L 170 130 Q 170 120 195 125" fill="url(#bodydisp)" stroke="#b09cd8" stroke-width="1"/>
    <!-- Main body (narrow, tall) -->
    <rect x="103" y="133" width="94" height="185" rx="14" fill="url(#bodydisp)" stroke="#b09cd8" stroke-width="1.5"/>
    <!-- Bottom -->
    <ellipse cx="150" cy="318" rx="47" ry="10" fill="#c8b8e8" stroke="#b09cd8" stroke-width="1"/>
    <!-- Highlight -->
    <rect x="111" y="137" width="16" height="173" rx="8" fill="white" opacity="0.30"/>
    <!-- Label -->
    <rect x="114" y="155" width="72" height="115" rx="8" fill="#4a3a8c" opacity="0.88"/>
    <text x="150" y="180" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="12" font-weight="900" fill="white">TOSHI</text>
    <text x="150" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="6.5" font-weight="700" fill="#F5A623" letter-spacing="1.5">ENTERPRISES</text>
    <line x1="121" y1="201" x2="179" y2="201" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="150" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white">300 ml</text>
    <text x="150" y="233" text-anchor="middle" font-family="Arial,sans-serif" font-size="6.5" fill="rgba(255,255,255,0.8)">Pump Dispenser</text>
    <text x="150" y="248" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="rgba(255,255,255,0.7)">Food Grade PET</text>
    <text x="150" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="rgba(255,255,255,0.7)">BPA Free</text>
    <!-- Pump output arrow -->
    <path d="M 180 35 L 196 35" stroke="#7b68d4" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>
    <!-- Ridges -->
    <line x1="104" y1="158" x2="196" y2="158" stroke="rgba(176,156,216,0.5)" stroke-width="1.5"/>
    <line x1="104" y1="300" x2="196" y2="300" stroke="rgba(176,156,216,0.5)" stroke-width="1.5"/>
  </g>
  <text x="150" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#4a3a8c">300 ml Pump Dispenser</text>
  <text x="150" y="375" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#4A5568">Soap • Sanitiser • Lotion • BPA Free</text>
</svg>
