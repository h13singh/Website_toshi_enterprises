<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <defs>
    <linearGradient id="bg1l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#e8f4fd"/>
    </linearGradient>
    <linearGradient id="body1l" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8dcf0" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#ddf0ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f0f8ff" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#d0e8f5" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a0c8e0" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="cap1l" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3498db"/>
      <stop offset="100%" stop-color="#1a5f8a"/>
    </linearGradient>
    <filter id="shadow1l">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
  </defs>
  <rect width="300" height="400" fill="url(#bg1l)" rx="16"/>
  <g filter="url(#shadow1l)">
    <!-- Cap -->
    <rect x="120" y="30" width="60" height="35" rx="8" fill="url(#cap1l)"/>
    <rect x="116" y="60" width="68" height="8" rx="3" fill="#1a5f8a"/>
    <!-- Neck -->
    <rect x="125" y="68" width="50" height="25" rx="4" fill="url(#body1l)" stroke="#a0c4d8" stroke-width="1"/>
    <!-- Shoulder -->
    <path d="M 85 93 Q 125 90 125 100 L 125 105 L 175 105 L 175 100 Q 175 90 215 93" fill="url(#body1l)" stroke="#a0c4d8" stroke-width="1"/>
    <!-- Main body -->
    <rect x="85" y="105" width="130" height="200" rx="12" fill="url(#body1l)" stroke="#a0c4d8" stroke-width="1"/>
    <!-- Bottom -->
    <ellipse cx="150" cy="305" rx="65" ry="12" fill="#c0dcea" stroke="#a0c4d8" stroke-width="1"/>
    <!-- Highlight -->
    <rect x="95" y="108" width="22" height="190" rx="11" fill="white" opacity="0.35"/>
    <!-- Label -->
    <rect x="100" y="155" width="100" height="90" rx="6" fill="#1A3A6B" opacity="0.88"/>
    <text x="150" y="180" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="14" font-weight="900" fill="white">TOSHI</text>
    <text x="150" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="700" fill="#F5A623" letter-spacing="2">ENTERPRISES</text>
    <line x1="108" y1="203" x2="192" y2="203" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="150" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white">1 Litre</text>
    <text x="150" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="7.5" fill="rgba(255,255,255,0.75)">Food Grade PET | BPA Free</text>
    <!-- Ridges -->
    <line x1="86" y1="120" x2="214" y2="120" stroke="rgba(160,196,216,0.5)" stroke-width="1.5"/>
    <line x1="86" y1="290" x2="214" y2="290" stroke="rgba(160,196,216,0.5)" stroke-width="1.5"/>
  </g>
  <text x="150" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#1A3A6B">1 Litre PET Bottle — Classic</text>
  <text x="150" y="375" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#4A5568">Food Grade • BPA Free • Custom Label</text>
</svg>
