<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <defs>
    <linearGradient id="bg25" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="100%" stop-color="#fdeee0"/>
    </linearGradient>
    <linearGradient id="body25" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0d8b8" stop-opacity="0.7"/>
      <stop offset="25%" stop-color="#fdf0e0" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#fff8f5" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#f5e0cc" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#e0c0a0" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="cap25" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e67e22"/>
      <stop offset="100%" stop-color="#b05000"/>
    </linearGradient>
    <filter id="sh25">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
  </defs>
  <rect width="300" height="400" fill="url(#bg25)" rx="16"/>
  <g filter="url(#sh25)">
    <!-- Snap lid -->
    <rect x="92" y="88" width="116" height="20" rx="6" fill="url(#cap25)"/>
    <rect x="88" y="104" width="124" height="8" rx="3" fill="#b05000"/>
    <!-- Small square container -->
    <rect x="80" y="112" width="140" height="150" rx="8" fill="url(#body25)" stroke="#d4b888" stroke-width="1"/>
    <!-- Bottom -->
    <ellipse cx="150" cy="262" rx="70" ry="10" fill="#d8c0a0" stroke="#d4b888" stroke-width="1"/>
    <!-- Highlight -->
    <rect x="87" y="115" width="18" height="140" rx="9" fill="white" opacity="0.35"/>
    <!-- Label -->
    <rect x="96" y="142" width="108" height="78" rx="6" fill="#b05000" opacity="0.88"/>
    <text x="150" y="164" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="12" font-weight="900" fill="white">TOSHI</text>
    <text x="150" y="178" text-anchor="middle" font-family="Arial,sans-serif" font-size="6.5" font-weight="700" fill="#F5A623" letter-spacing="1.5">ENTERPRISES</text>
    <line x1="103" y1="184" x2="197" y2="184" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="150" y="198" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white">250 ml</text>
    <text x="150" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="6.5" fill="rgba(255,255,255,0.75)">Square Container</text>
    <line x1="81" y1="126" x2="219" y2="126" stroke="rgba(212,184,136,0.5)" stroke-width="1.5"/>
    <line x1="81" y1="248" x2="219" y2="248" stroke="rgba(212,184,136,0.5)" stroke-width="1.5"/>
  </g>
  <text x="150" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#b05000">250 ml PET Container</text>
  <text x="150" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#4A5568">Food Grade • BPA Free • Snap Lid</text>
</svg>
