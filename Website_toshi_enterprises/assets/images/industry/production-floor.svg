<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <defs>
    <linearGradient id="ceilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c8d8ec"/>
      <stop offset="100%" stop-color="#dce8f5"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8c8d8"/>
      <stop offset="100%" stop-color="#98aabb"/>
    </linearGradient>
    <linearGradient id="machGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#607080"/>
      <stop offset="100%" stop-color="#384858"/>
    </linearGradient>
    <linearGradient id="beltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>
  </defs>

  <!-- Background wall -->
  <rect width="600" height="350" fill="url(#ceilGrad)"/>

  <!-- Floor -->
  <rect x="0" y="260" width="600" height="90" fill="url(#floorGrad)"/>
  <!-- Floor tiles -->
  <g stroke="#a0b0c0" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="280" x2="600" y2="280"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="100" y1="260" x2="100" y2="350"/>
    <line x1="200" y1="260" x2="200" y2="350"/>
    <line x1="300" y1="260" x2="300" y2="350"/>
    <line x1="400" y1="260" x2="400" y2="350"/>
    <line x1="500" y1="260" x2="500" y2="350"/>
  </g>

  <!-- Ceiling structure -->
  <rect x="0" y="0" width="600" height="30" fill="#b0c4d8"/>
  <!-- Ceiling beams -->
  <g fill="#a0b4c8" stroke="#8898a8" stroke-width="1">
    <rect x="50" y="0" width="18" height="30"/>
    <rect x="170" y="0" width="18" height="30"/>
    <rect x="290" y="0" width="18" height="30"/>
    <rect x="410" y="0" width="18" height="30"/>
    <rect x="530" y="0" width="18" height="30"/>
  </g>
  <!-- Hanging lights -->
  <g>
    <line x1="90" y1="30" x2="90" y2="65" stroke="#888" stroke-width="2"/>
    <ellipse cx="90" cy="70" rx="14" ry="8" fill="#FFE860" opacity="0.9"/>
    <ellipse cx="90" cy="67" rx="12" ry="6" fill="#FFF0A0" opacity="0.7"/>
    <!-- Light glow -->
    <ellipse cx="90" cy="90" rx="30" ry="15" fill="#FFE860" opacity="0.08"/>
  </g>
  <g>
    <line x1="210" y1="30" x2="210" y2="65" stroke="#888" stroke-width="2"/>
    <ellipse cx="210" cy="70" rx="14" ry="8" fill="#FFE860" opacity="0.9"/>
    <ellipse cx="210" cy="67" rx="12" ry="6" fill="#FFF0A0" opacity="0.7"/>
    <ellipse cx="210" cy="90" rx="30" ry="15" fill="#FFE860" opacity="0.08"/>
  </g>
  <g>
    <line x1="330" y1="30" x2="330" y2="65" stroke="#888" stroke-width="2"/>
    <ellipse cx="330" cy="70" rx="14" ry="8" fill="#FFE860" opacity="0.9"/>
    <ellipse cx="330" cy="67" rx="12" ry="6" fill="#FFF0A0" opacity="0.7"/>
    <ellipse cx="330" cy="90" rx="30" ry="15" fill="#FFE860" opacity="0.08"/>
  </g>
  <g>
    <line x1="450" y1="30" x2="450" y2="65" stroke="#888" stroke-width="2"/>
    <ellipse cx="450" cy="70" rx="14" ry="8" fill="#FFE860" opacity="0.9"/>
    <ellipse cx="450" cy="67" rx="12" ry="6" fill="#FFF0A0" opacity="0.7"/>
    <ellipse cx="450" cy="90" rx="30" ry="15" fill="#FFE860" opacity="0.08"/>
  </g>

  <!-- Machine 1 (left — injection moulding press) -->
  <g>
    <rect x="15" y="120" width="95" height="145" rx="6" fill="url(#machGrad)"/>
    <!-- Machine top press arm -->
    <rect x="20" y="110" width="85" height="18" rx="4" fill="#4a5868"/>
    <rect x="48" y="90" width="28" height="22" rx="3" fill="#384858"/>
    <!-- Control panel -->
    <rect x="22" y="180" width="62" height="55" rx="4" fill="#1a2838"/>
    <circle cx="38" cy="196" r="5" fill="#ff4444"/>
    <circle cx="58" cy="196" r="5" fill="#44ff44"/>
    <circle cx="78" cy="196" r="5" fill="#F5A623"/>
    <rect x="26" y="210" width="54" height="18" rx="3" fill="#2a3848"/>
    <!-- Machine label -->
    <text x="62" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#a0b8cc" font-weight="600">MOULDING</text>
    <text x="62" y="168" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#a0b8cc">PRESS</text>
  </g>

  <!-- Machine 2 (right — testing/QC unit) -->
  <g>
    <rect x="490" y="115" width="100" height="150" rx="6" fill="url(#machGrad)"/>
    <rect x="493" y="108" width="94" height="14" rx="4" fill="#4a5868"/>
    <!-- Display screen -->
    <rect x="500" y="125" width="74" height="50" rx="4" fill="#0a1828"/>
    <text x="537" y="148" text-anchor="middle" font-family="monospace" font-size="9" fill="#00ff88">PASS: 128</text>
    <text x="537" y="162" text-anchor="middle" font-family="monospace" font-size="9" fill="#ff4444">FAIL:  02</text>
    <!-- Panel buttons -->
    <rect x="500" y="186" width="74" height="40" rx="3" fill="#1a2838"/>
    <circle cx="520" cy="206" r="6" fill="#ff4444"/>
    <circle cx="540" cy="206" r="6" fill="#44ff44"/>
    <circle cx="560" cy="206" r="6" fill="#F5A623"/>
    <text x="540" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#a0b8cc" font-weight="600">QC UNIT</text>
    <text x="540" y="253" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#a0b8cc">TESTING</text>
  </g>

  <!-- Conveyor belt system -->
  <!-- Belt structure -->
  <rect x="110" y="225" width="378" height="20" rx="4" fill="#333"/>
  <rect x="110" y="228" width="378" height="14" rx="2" fill="url(#beltGrad)"/>
  <!-- Belt pattern lines -->
  <g stroke="#555" stroke-width="1">
    <line x1="130" y1="228" x2="130" y2="242"/>
    <line x1="155" y1="228" x2="155" y2="242"/>
    <line x1="180" y1="228" x2="180" y2="242"/>
    <line x1="205" y1="228" x2="205" y2="242"/>
    <line x1="230" y1="228" x2="230" y2="242"/>
    <line x1="255" y1="228" x2="255" y2="242"/>
    <line x1="280" y1="228" x2="280" y2="242"/>
    <line x1="305" y1="228" x2="305" y2="242"/>
    <line x1="330" y1="228" x2="330" y2="242"/>
    <line x1="355" y1="228" x2="355" y2="242"/>
    <line x1="380" y1="228" x2="380" y2="242"/>
    <line x1="405" y1="228" x2="405" y2="242"/>
    <line x1="430" y1="228" x2="430" y2="242"/>
    <line x1="455" y1="228" x2="455" y2="242"/>
    <line x1="480" y1="228" x2="480" y2="242"/>
  </g>
  <!-- Belt rollers -->
  <circle cx="110" cy="235" r="10" fill="#555"/>
  <circle cx="488" cy="235" r="10" fill="#555"/>
  <circle cx="110" cy="235" r="6" fill="#333"/>
  <circle cx="488" cy="235" r="6" fill="#333"/>
  <!-- Belt support legs -->
  <rect x="145" y="245" width="10" height="16" fill="#555"/>
  <rect x="270" y="245" width="10" height="16" fill="#555"/>
  <rect x="440" y="245" width="10" height="16" fill="#555"/>

  <!-- Products on belt (bottles) -->
  <!-- Bottle 1 -->
  <g transform="translate(140, 190)">
    <rect x="-8" y="0" width="16" height="34" rx="3" fill="rgba(180,220,250,0.85)" stroke="#88b8d8" stroke-width="1"/>
    <rect x="-5" y="-6" width="10" height="8" rx="2" fill="#3498db"/>
    <rect x="-3" y="8" width="6" height="14" rx="2" fill="rgba(26,58,107,0.7)"/>
  </g>
  <!-- Bottle 2 -->
  <g transform="translate(190, 192)">
    <rect x="-8" y="0" width="16" height="30" rx="3" fill="rgba(180,220,250,0.85)" stroke="#88b8d8" stroke-width="1"/>
    <rect x="-5" y="-6" width="10" height="8" rx="2" fill="#3498db"/>
    <rect x="-3" y="7" width="6" height="12" rx="2" fill="rgba(26,58,107,0.7)"/>
  </g>
  <!-- Electrical box on belt -->
  <g transform="translate(270, 198)">
    <rect x="-18" y="0" width="36" height="24" rx="3" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
    <rect x="-14" y="4" width="12" height="10" rx="2" fill="#ddd"/>
    <rect x="2" y="4" width="12" height="10" rx="2" fill="#ddd"/>
    <text x="0" y="20" text-anchor="middle" font-family="Arial,sans-serif" font-size="4" fill="#666">SWITCH</text>
  </g>
  <!-- Bottle 3 -->
  <g transform="translate(360, 188)">
    <rect x="-9" y="0" width="18" height="36" rx="3" fill="rgba(180,220,250,0.85)" stroke="#88b8d8" stroke-width="1"/>
    <rect x="-5" y="-8" width="10" height="10" rx="2" fill="#27ae60"/>
    <rect x="-4" y="9" width="8" height="15" rx="2" fill="rgba(20,90,50,0.7)"/>
  </g>
  <!-- Socket adapter on belt -->
  <g transform="translate(430, 200)">
    <rect x="-15" y="0" width="30" height="22" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <circle cx="0" cy="8" r="4" fill="#ddd"/>
    <circle cx="-8" cy="16" r="3" fill="#e0a030" opacity="0.8"/>
    <circle cx="8" cy="16" r="3" fill="#e0a030" opacity="0.8"/>
  </g>

  <!-- Worker silhouettes -->
  <!-- Worker 1 (left, operating machine) -->
  <g fill="#2a3848" opacity="0.8">
    <circle cx="120" cy="185" r="10"/>
    <rect x="113" y="195" width="14" height="35" rx="4"/>
    <line x1="113" y1="205" x2="100" y2="215" stroke="#2a3848" stroke-width="5" stroke-linecap="round"/>
    <line x1="127" y1="205" x2="140" y2="215" stroke="#2a3848" stroke-width="5" stroke-linecap="round"/>
    <line x1="116" y1="230" x2="112" y2="255" stroke="#2a3848" stroke-width="5" stroke-linecap="round"/>
    <line x1="124" y1="230" x2="128" y2="255" stroke="#2a3848" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- Worker 2 (centre, inspecting belt) -->
  <g fill="#2a3848" opacity="0.8">
    <circle cx="305" cy="183" r="11"/>
    <rect x="297" y="194" width="16" height="36" rx="4"/>
    <line x1="297" y1="205" x2="283" y2="218" stroke="#2a3848" stroke-width="5" stroke-linecap="round"/>
    <line x1="313" y1="205" x2="325" y2="220" stroke="#2a3848" stroke-width="5" stroke-linecap="round"/>
    <line x1="300" y1="230" x2="296" y2="258" stroke="#2a3848" stroke-width="5" stroke-linecap="round"/>
    <line x1="310" y1="230" x2="314" y2="258" stroke="#2a3848" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- Worker 3 (right, QC station) -->
  <g fill="#2a3848" opacity="0.8">
    <circle cx="475" cy="187" r="10"/>
    <rect x="468" y="197" width="14" height="35" rx="4"/>
    <line x1="468" y1="208" x2="455" y2="218" stroke="#2a3848" stroke-width="5" stroke-linecap="round"/>
    <line x1="482" y1="208" x2="495" y2="215" stroke="#2a3848" stroke-width="5" stroke-linecap="round"/>
    <line x1="471" y1="232" x2="467" y2="258" stroke="#2a3848" stroke-width="5" stroke-linecap="round"/>
    <line x1="479" y1="232" x2="483" y2="258" stroke="#2a3848" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Safety helmets on workers -->
  <g fill="#F5A623" opacity="0.9">
    <ellipse cx="120" cy="179" rx="12" ry="6"/>
    <ellipse cx="305" cy="177" rx="13" ry="6"/>
    <ellipse cx="475" cy="181" rx="12" ry="6"/>
  </g>

  <!-- Stacked boxes (finished goods) -->
  <g>
    <rect x="3" y="235" width="60" height="22" rx="2" fill="#d4c090" stroke="#b09060" stroke-width="1"/>
    <rect x="8" y="215" width="50" height="22" rx="2" fill="#d4c090" stroke="#b09060" stroke-width="1"/>
    <rect x="12" y="196" width="42" height="20" rx="2" fill="#d4c090" stroke="#b09060" stroke-width="1"/>
    <text x="33" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#6a5030">TOSHI ENT.</text>
    <text x="33" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#6a5030">TOSHI ENT.</text>
  </g>

  <!-- Title banner at top -->
  <rect x="200" y="35" width="200" height="32" rx="6" fill="rgba(26,58,107,0.85)"/>
  <text x="300" y="52" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="11" font-weight="900" fill="white">TOSHI ENTERPRISES</text>
  <text x="300" y="63" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#F5A623">Production Floor — Haridwar</text>

  <!-- Caption bar -->
  <rect x="0" y="330" width="600" height="20" fill="rgba(26,58,107,0.12)"/>
  <text x="300" y="344" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#1A3A6B" font-weight="600">ISI-Certified Manufacturing — Electrical Accessories &amp; Food-Grade PET Products</text>
</svg>
