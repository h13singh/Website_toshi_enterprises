<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#d0eaff"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a5fa8"/>
      <stop offset="100%" stop-color="#1A3A6B"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dce8f5"/>
      <stop offset="100%" stop-color="#c8d8ec"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7cb87c"/>
      <stop offset="100%" stop-color="#4a8a4a"/>
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect width="600" height="350" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="530" cy="55" r="32" fill="#FFD700" opacity="0.9"/>
  <g stroke="#FFD700" stroke-width="2.5" opacity="0.7">
    <line x1="530" y1="12" x2="530" y2="5"/>
    <line x1="557" y1="28" x2="562" y2="22"/>
    <line x1="572" y1="55" x2="579" y2="55"/>
    <line x1="557" y1="82" x2="562" y2="88"/>
    <line x1="530" y1="96" x2="530" y2="103"/>
    <line x1="503" y1="82" x2="498" y2="88"/>
    <line x1="489" y1="55" x2="482" y2="55"/>
    <line x1="503" y1="28" x2="498" y2="22"/>
  </g>

  <!-- Clouds -->
  <g fill="white" opacity="0.8">
    <ellipse cx="80" cy="60" rx="38" ry="18"/>
    <ellipse cx="110" cy="52" rx="28" ry="16"/>
    <ellipse cx="55" cy="55" rx="22" ry="14"/>
    <ellipse cx="380" cy="45" rx="32" ry="15"/>
    <ellipse cx="408" cy="38" rx="24" ry="14"/>
    <ellipse cx="356" cy="42" rx="20" ry="12"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="295" width="600" height="55" fill="url(#groundGrad)"/>
  <rect x="0" y="295" width="600" height="8" fill="#5a9a5a" opacity="0.5"/>

  <!-- Road/path -->
  <rect x="220" y="295" width="160" height="55" fill="#c0b090"/>
  <rect x="290" y="300" width="20" height="50" fill="#d0c0a0" opacity="0.5"/>

  <!-- Left trees -->
  <g>
    <rect x="18" y="255" width="12" height="44" fill="#6b4226"/>
    <ellipse cx="24" cy="240" rx="26" ry="32" fill="#2d7a2d"/>
    <ellipse cx="24" cy="232" rx="20" ry="24" fill="#3a9a3a"/>
  </g>
  <g>
    <rect x="48" y="260" width="10" height="40" fill="#6b4226"/>
    <ellipse cx="53" cy="246" rx="22" ry="28" fill="#2d7a2d"/>
    <ellipse cx="53" cy="238" rx="17" ry="21" fill="#3a9a3a"/>
  </g>

  <!-- Right trees -->
  <g>
    <rect x="542" y="255" width="12" height="44" fill="#6b4226"/>
    <ellipse cx="548" cy="240" rx="26" ry="32" fill="#2d7a2d"/>
    <ellipse cx="548" cy="232" rx="20" ry="24" fill="#3a9a3a"/>
  </g>
  <g>
    <rect x="510" y="260" width="10" height="40" fill="#6b4226"/>
    <ellipse cx="515" cy="246" rx="22" ry="28" fill="#2d7a2d"/>
    <ellipse cx="515" cy="238" rx="17" ry="21" fill="#3a9a3a"/>
  </g>

  <!-- Chimney 1 -->
  <rect x="155" y="120" width="22" height="100" fill="#888"/>
  <ellipse cx="166" cy="118" rx="12" ry="5" fill="#777"/>
  <!-- Smoke puffs -->
  <circle cx="166" cy="105" r="9" fill="white" opacity="0.5"/>
  <circle cx="170" cy="90" r="11" fill="white" opacity="0.35"/>
  <circle cx="165" cy="75" r="13" fill="white" opacity="0.22"/>

  <!-- Chimney 2 -->
  <rect x="190" y="130" width="18" height="90" fill="#888"/>
  <ellipse cx="199" cy="128" rx="10" ry="4" fill="#777"/>
  <circle cx="199" cy="116" r="7" fill="white" opacity="0.45"/>
  <circle cx="203" cy="102" r="9" fill="white" opacity="0.28"/>

  <!-- Main building wall -->
  <rect x="80" y="165" width="440" height="132" fill="url(#wallGrad)"/>
  <!-- Building top (flat roof edge) -->
  <rect x="80" y="158" width="440" height="12" fill="#a0b8d0"/>

  <!-- Roof (peaked) -->
  <polygon points="75,165 300,100 525,165" fill="url(#roofGrad)"/>
  <!-- Roof edge/trim -->
  <line x1="75" y1="165" x2="525" y2="165" stroke="#1A3A6B" stroke-width="3"/>
  <!-- Roof ridge cap -->
  <polygon points="290,102 300,97 310,102" fill="#F5A623"/>

  <!-- Windows row -->
  <g fill="#a8d4f8" stroke="#6a9cc0" stroke-width="1.5">
    <rect x="110" y="188" width="42" height="36" rx="3"/>
    <rect x="170" y="188" width="42" height="36" rx="3"/>
    <rect x="230" y="188" width="42" height="36" rx="3"/>
    <rect x="340" y="188" width="42" height="36" rx="3"/>
    <rect x="400" y="188" width="42" height="36" rx="3"/>
    <rect x="460" y="188" width="42" height="36" rx="3"/>
  </g>
  <!-- Window reflections -->
  <g fill="white" opacity="0.3">
    <rect x="112" y="190" width="10" height="32" rx="2"/>
    <rect x="172" y="190" width="10" height="32" rx="2"/>
    <rect x="232" y="190" width="10" height="32" rx="2"/>
    <rect x="342" y="190" width="10" height="32" rx="2"/>
    <rect x="402" y="190" width="10" height="32" rx="2"/>
    <rect x="462" y="190" width="10" height="32" rx="2"/>
  </g>

  <!-- Main entrance door -->
  <rect x="258" y="230" width="84" height="67" rx="4" fill="#8a7060"/>
  <rect x="262" y="234" width="35" height="60" rx="2" fill="#9a8070"/>
  <rect x="302" y="234" width="36" height="60" rx="2" fill="#9a8070"/>
  <circle cx="298" cy="264" r="4" fill="#F5A623"/>
  <circle cx="302" cy="264" r="4" fill="#F5A623"/>

  <!-- Company sign board -->
  <rect x="185" y="135" width="230" height="30" rx="5" fill="#1A3A6B"/>
  <rect x="187" y="137" width="226" height="26" rx="4" fill="#1A3A6B" stroke="#F5A623" stroke-width="1.5"/>
  <text x="300" y="154" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="13" font-weight="900" fill="white" letter-spacing="1">TOSHI ENTERPRISES</text>

  <!-- Gate posts -->
  <rect x="218" y="270" width="10" height="28" fill="#888"/>
  <rect x="372" y="270" width="10" height="28" fill="#888"/>

  <!-- Small bushes near entrance -->
  <ellipse cx="240" cy="294" rx="18" ry="10" fill="#2d8a2d"/>
  <ellipse cx="360" cy="294" rx="18" ry="10" fill="#2d8a2d"/>

  <!-- Caption -->
  <rect x="0" y="330" width="600" height="20" fill="rgba(26,58,107,0.1)"/>
  <text x="300" y="344" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#1A3A6B" font-weight="600">Toshi Enterprises — Bhadrabad Industrial Area, Haridwar, Uttarakhand 249403</text>
</svg>
